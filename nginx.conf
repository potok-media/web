server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /wiki { return 301 /wiki/$is_args$args; }
    location /wiki/ {
        try_files $uri $uri/ =404;
        error_page 404 /wiki/404.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
