name: Crowdin sync

# Fully automatic, zero manual steps. Crowdin is an AUTHORING tool only — never in the
# app runtime.
#  - push to the English source  → upload source strings + seed any translations Crowdin
#    doesn't have yet (existing ru + authored values for new keys). Crowdin does NOT
#    overwrite translations it already has, so translators' edits are safe.
#  - daily schedule              → download translations and commit them straight to main
#    (no PR, no manual merge). The app bundles them from its own origin; if Crowdin is
#    down, users are unaffected (last-synced files are already committed).

on:
  push:
    branches: [main]
    paths:
      - "src/i18n/locales/en.json"
      - "crowdin.yml"
      - ".github/workflows/crowdin-sync.yml"
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload sources & seed translations
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: false
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Download translations & commit to main
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: false
          push_translations: true
          commit_message: "chore(i18n): sync translations from Crowdin [skip ci]"
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
